# NixOS has already initialized graphics, loaded fonts and read grubenv.
# Honor grub-reboot's one-shot selection without re-reading next_entry.
if [ "$double_minegrub_entered" != "1" ]; then
    if [ "$boot_once" != "true" ]; then
        if [ -f $prefix/../theme/mainmenu.cfg ]; then
            set double_minegrub_entered=1
            export double_minegrub_entered
            configfile $prefix/../theme/mainmenu.cfg
            unset double_minegrub_entered
        fi
    fi
fi
